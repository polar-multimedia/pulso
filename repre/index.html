<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071433">
<meta name="robots" content="noindex">
<title>Mis médicos · PULSO</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#030A1E;--card:#071433;--tx:#EAF1FF;--mut:#A9B7D3;--cian:#49E6FF;--coral:#FF6B5B;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(70vmax 50vmax at 50% -10%,rgba(30,70,168,.5),transparent 65%),linear-gradient(180deg,#071433,#030A1E);min-height:100vh}
main{max-width:520px;margin:0 auto;padding:28px 16px 48px}
.logo{display:block;height:40px;margin:0 auto 22px}
.card{background:rgba(7,20,51,.82);border:1px solid var(--line);border-radius:20px;padding:22px 18px}
h1{font-size:20px;font-weight:800;margin:0 0 6px}
p{font-size:14px;line-height:1.55;font-weight:600;color:var(--mut);margin:0 0 14px}
.name{font-size:22px;font-weight:800;color:#fff;margin:6px 0 16px}
label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin:14px 0 6px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(3,10,30,.7);color:#fff;font:700 15px Manrope,system-ui,sans-serif}
input:focus{outline:none;border-color:var(--cian)}
.btn{display:block;width:100%;margin-top:14px;padding:15px;border-radius:999px;border:none;background:var(--cian);color:#071433;font:800 15px Manrope,system-ui,sans-serif;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.55}
.err{color:var(--coral);font-weight:700;font-size:13px;min-height:18px;margin-top:10px}
.ok{color:var(--cian);font-weight:700;font-size:13px;margin-top:10px}
.lnk{background:none;border:none;color:var(--mut);text-decoration:underline;font:700 13px Manrope,system-ui,sans-serif;margin-top:14px;cursor:pointer;padding:4px}
.foot{font-size:11px;color:var(--mut);text-align:center;margin-top:22px;font-weight:600;line-height:1.5}
.foot a{color:var(--cian)}
</style>
<style>
main{max-width:640px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row .i{flex:1;min-width:0}
.row .n{font-weight:800;font-size:15px;color:#fff}
.row .s{font-size:12px;font-weight:700;color:var(--mut);margin-top:2px}
.row .s.in{color:var(--cian)}
.row button{flex:none;width:auto;margin:0;padding:10px 16px;font-size:13px}
.sum{display:flex;gap:10px;margin:4px 0 14px}
.sum div{flex:1;background:rgba(3,10,30,.6);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.sum b{display:block;font-size:22px;color:#fff}
.sum span{font-size:11px;font-weight:700;color:var(--mut)}
</style>
</head>
<body>
<main>
  <img class="logo" src="../img/pulso-logo.png" alt="PULSO by Lacteol">
  <div class="card" id="app"><p>Cargando…</p></div>
  <div class="foot">Liga personal para representantes de Carnot · No la reenvíe<br>Dudas: <a href="mailto:pulso@polarmultimedia.com">pulso@polarmultimedia.com</a></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=(new URLSearchParams(location.search).get('k')||'').trim();
let API='',D=null,msg='',busy='';
async function api(action,body){if(!API){const c=await fetch('../config.json',{cache:'no-store'}).then(r=>r.json());API=c.appsScriptUrl}
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...body}),redirect:'follow'});
  if(!r.ok)throw new Error('Sin respuesta del servidor');return r.json()}
function render(){const a=$('#app');
  if(!D){a.innerHTML=`<h1>Mis médicos</h1><p>${esc(msg||'Cargando…')}</p>`;return}
  const inn=D.doctors.filter(d=>d.checkedIn);
  a.innerHTML=`<h1>Hola, ${esc(D.rep)}</h1><p>Estos son los médicos que tiene asignados en PULSO. ${D.open?'Puede descargar la constancia de quienes asistieron.':'Las constancias se liberan el 26 de noviembre a las 20:40 h.'}</p>
   <div class="sum"><div><b>${D.doctors.length}</b><span>Invitados</span></div><div><b>${inn.length}</b><span>Asistieron</span></div><div><b>${D.doctors.filter(d=>d.certSent).length}</b><span>Constancia enviada</span></div></div>
   ${msg?`<div class="err">${esc(msg)}</div>`:''}
   ${D.doctors.map(d=>`<div class="row"><div class="i"><div class="n">${esc(d.name)}</div><div class="s${d.checkedIn?' in':''}">${d.checkedIn?(d.certSent?'Asistió · constancia enviada':'Asistió'):'Sin registro de llegada'}</div></div>${d.checkedIn&&D.open?`<button class="btn" data-id="${esc(d.id)}" ${busy?'disabled':''}>${busy===d.id?'…':'PDF'}</button>`:''}</div>`).join('')||'<p>Aún no hay médicos asignados.</p>'}`;
  a.querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{busy=b.dataset.id;msg='';render();
    try{const r=await api('repCert',{k:K,id:busy});if(r.success){const bin=atob(r.pdf),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      const url=URL.createObjectURL(new Blob([u8],{type:'application/pdf'}));const l=document.createElement('a');l.href=url;l.download=r.filename||'Constancia PULSO.pdf';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}else msg=r.message}
    catch(x){msg=x.message}busy='';render()});
}
(async()=>{if(!K){msg='Abra la liga que le llegó por correo.';render();return}
  try{const r=await api('repList',{k:K});if(r.success)D=r;else msg=r.message}catch(x){msg=x.message}render()})();
</script>
</body>
</html>
