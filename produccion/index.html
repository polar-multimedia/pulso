<!doctype html>

<meta name="robots" content="noindex,nofollow">

<title>PULSO Producción</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Tablero por secciones en el orden del recorrido: índice a la izquierda con avance por área, lámina de la sección a la derecha con su lista de piezas para palomear. Una sola apariencia oscura, como el recinto. */
:root{
  --bg:#060b19; --panel:#0d1530; --panel2:#111c3d; --line:#1f2c55; --fg:#eaf1fc; --muted:#a3b3d2;
  --cyan:#46dcef; --lime:#c8cf00; --coral:#ff9b73; --pink:#ff5fa2; --ok:#5ee39b;
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f);font-weight:500;font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{margin:0;font-weight:800;line-height:1.2;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.top .brand{display:grid;gap:2px;min-width:0}
.top .brand b{font-size:17px;font-weight:800}
.top .brand span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.prog{flex:1 1 260px;display:grid;gap:6px;min-width:0}
.prog .bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--lime));transition:width .4s}
.prog small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.quien{display:grid;gap:2px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.quien input{font:inherit;font-size:14px;letter-spacing:0;text-transform:none;font-weight:700;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:180px}
.sync{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.sync.live{color:var(--ok)}
.sync.off{color:var(--coral)}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.idx{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);align-self:start;display:grid;gap:2px;max-height:calc(100vh - 110px);overflow:auto}
nav.idx .grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:12px 10px 4px}
nav.idx a{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:700;font-size:14px}
nav.idx a:hover{background:var(--panel)}
nav.idx a[aria-current="page"]{background:var(--panel2);box-shadow:inset 3px 0 0 var(--cyan)}
nav.idx a .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
nav.idx a .n.full{color:var(--ok)}
main{min-width:0;display:grid;gap:22px;align-content:start}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);font-weight:800}
.head{display:grid;gap:8px}
.head h2{font-size:26px}
.head p{color:var(--muted);max-width:72ch}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-items:start}
.gal figure{margin:0;display:grid;gap:6px;min-width:0}
.gal img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.gal figcaption{font-size:13px;color:var(--muted)}
.gal.one{grid-template-columns:1fr}
.pz{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-top:10px}
.pz .ths{display:flex;gap:8px;flex-wrap:wrap}
.pz figure{margin:0;display:grid;gap:4px;width:120px}
.pz figure img{width:120px;height:120px;object-fit:contain;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:zoom-in}
.pz figcaption{font-size:11px;color:var(--muted);text-align:center}
.pz .btns{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;flex:1;min-width:220px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none;border:1px solid var(--line);color:var(--fg);background:var(--panel)}
.dlg{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}.dlg h3{margin:0 0 2px}.dlg>.btn{justify-self:start}.dlr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}.dlt{flex:1;min-width:200px;display:grid;gap:2px}.dlt span{font-size:12px;color:var(--muted)}
.btn.pri{background:var(--cyan);border-color:var(--cyan);color:#06121f}
.btn:hover{filter:brightness(1.1)}

.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}
.vids figure{margin:0;display:grid;gap:6px;min-width:0}
.vids video{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);background:#000}
.vids.wide{grid-template-columns:1fr}
.vids figcaption{font-size:13px;color:var(--muted)}
.carnot{border-left:4px solid var(--pink);background:rgba(255,95,162,.08);border-radius:0 8px 8px 0;padding:10px 14px;font-size:14px;display:grid;gap:4px}
.carnot b.t{color:var(--pink);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.list{display:grid;gap:8px}
.list h3{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:800;margin-top:6px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.item.done{border-color:rgba(94,227,155,.45);background:linear-gradient(0deg,rgba(94,227,155,.06),rgba(94,227,155,.06)),var(--panel)}
.chk{appearance:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;margin-top:1px}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:7px;height:13px;border:solid #06240f;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk:disabled{cursor:not-allowed;opacity:.5}
.ib{display:grid;gap:6px;min-width:0}
.ib .nm{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.ib .nm b{font-size:16px;font-weight:800}
.tipo{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tipo.imp{color:var(--cyan);border-color:rgba(70,220,239,.5)}
.tipo.mob{color:var(--coral);border-color:rgba(255,155,115,.5)}
.tipo.pan{color:var(--lime);border-color:rgba(200,207,0,.5)}
.tipo.prd{color:#cdb8ff;border-color:rgba(205,184,255,.5)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 18px;font-size:13.5px}
.meta div{min-width:0;overflow-wrap:anywhere}
.meta span{color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block}
.falta{font-size:13.5px;color:var(--coral)}
.dl{color:var(--cyan);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.who{font-size:12.5px;color:var(--ok);font-weight:700}
.nav2{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.nav2 a{color:var(--fg);text-decoration:none;font-weight:800;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.nav2 a:hover{border-color:var(--cyan)}
.empty-note{font-size:13px;color:var(--muted)}
table.res{width:100%;border-collapse:collapse;font-size:14px}
table.res th,table.res td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.res th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
table.res td:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbx{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);align-items:center}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.idx{position:static;max-height:none;display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
  nav.idx .grp{display:none}
  nav.idx a{white-space:nowrap;grid-template-columns:auto auto;background:var(--panel)}
}
.gal img{cursor:zoom-in}
dialog.lb{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100vw;height:100vh;margin:0}
dialog.lb::backdrop{background:rgba(3,6,14,.92)}
dialog.lb .wrapb{width:100%;height:100%;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:10px;grid-template-rows:1fr auto}
dialog.lb img{max-width:100%;max-height:calc(100vh - 90px);object-fit:contain;border-radius:6px;cursor:zoom-out}
dialog.lb p{color:var(--fg);font-size:14px;text-align:center}
dialog.lb button{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:800;cursor:pointer}
@media (prefers-reduced-motion:reduce){.prog .bar i{transition:none}}
</style>

document.addEventListener('change',e=>{

function setSync(t,c){const s=$('#sync');s.textContent=t;s.className='sync '+c}
function publish(){ if(client&&client.connected){ client.publish(TOPIC,JSON.stringify(checks),{qos:1,retain:true}) } else setSync('Sin conexión: guardado en este equipo','off') }
function merge(remote){ let changed=false, needPush=false;
  for(const k in remote){const r=remote[k],l=checks[k]; if(!l||(r&&r.at>l.at)){checks[k]=r;changed=true}}
  for(const k in checks){const r=remote[k]; if(!r||checks[k].at>r.at) needPush=true}
  if(changed){saveLocal();render()} if(needPush) publish(); }

try{

  let got=false;
  client.on('connect',()=>{setSync('Avance compartido en vivo','live');client.subscribe(TOPIC,{qos:1});setTimeout(()=>{if(!got&&Object.keys(checks).length)publish()},4000)});
  client.on('message',(t,m)=>{got=true;try{merge(JSON.parse(m.toString()||'{}'))}catch(e){}});
  client.on('offline',()=>setSync('Sin conexión: guardado en este equipo','off'));
  client.on('error',()=>setSync('Sin conexión: guardado en este equipo','off'));
}catch(e){setSync('Sin conexión: guardado en este equipo','off')}
